<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="portalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b171e"/>
      <stop offset="100%" stop-color="#132733"/>
    </linearGradient>
    <linearGradient id="concreteCol" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <pattern id="dotGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(20, 184, 166, 0.15)"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#portalBg)"/>
  <rect width="100%" height="100%" fill="url(#dotGrid)"/>

  <!-- Technical Header -->
  <text x="50" y="60" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" letter-spacing="2">PORTAL STRUKTUR GEDUNG 3 LANTAI</text>
  <text x="50" y="85" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">DWG-REF: PF-3FL • SKALA 1:50 • MODULAR MAGNETIC ASSEMBLY</text>

  <!-- Isometric / 2.5D Building Portal Frame Representation -->
  <g transform="translate(400, 320)">
    <!-- Base Foundation Pedestals -->
    <rect x="-240" y="160" width="80" height="30" fill="#1e293b" stroke="#14b8a6" stroke-width="2" rx="4"/>
    <rect x="-40" y="160" width="80" height="30" fill="#1e293b" stroke="#14b8a6" stroke-width="2" rx="4"/>
    <rect x="160" y="160" width="80" height="30" fill="#1e293b" stroke="#14b8a6" stroke-width="2" rx="4"/>

    <!-- Tie Beams (Sloof) -->
    <rect x="-220" y="150" width="440" height="18" fill="rgba(20, 184, 166, 0.2)" stroke="#2dd4bf" stroke-width="2"/>

    <!-- Columns (3 bays, 3 floors) -->
    <!-- Floor 1 Columns -->
    <rect x="-220" y="50" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-20" y="50" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="180" y="50" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Floor 2 Beams & Slab -->
    <rect x="-240" y="32" width="480" height="18" fill="#0ea5e9" opacity="0.85" rx="3"/>

    <!-- Floor 2 Columns -->
    <rect x="-220" y="-70" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-20" y="-70" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="180" y="-70" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Floor 3 Beams & Slab -->
    <rect x="-240" y="-88" width="480" height="18" fill="#0ea5e9" opacity="0.85" rx="3"/>

    <!-- Floor 3 Roof Columns -->
    <rect x="-220" y="-190" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-20" y="-190" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="180" y="-190" width="40" height="100" fill="url(#concreteCol)" stroke="#38bdf8" stroke-width="2"/>

    <!-- Roof Ring Balk -->
    <rect x="-240" y="-208" width="480" height="18" fill="#14b8a6" rx="3"/>

    <!-- Modular Stairs Representation (Center Left Bay) -->
    <path d="M -180 50 L -120 50 L -120 20 L -80 20 L -80 -10 L -40 -10 L -40 -70" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

    <!-- Detachable Joint Markers (Neodymium Magnets) -->
    <circle cx="-200" cy="41" r="5" fill="#f59e0b"/>
    <circle cx="0" cy="41" r="5" fill="#f59e0b"/>
    <circle cx="200" cy="41" r="5" fill="#f59e0b"/>
    <circle cx="-200" cy="-79" r="5" fill="#f59e0b"/>
    <circle cx="0" cy="-79" r="5" fill="#f59e0b"/>
    <circle cx="200" cy="-79" r="5" fill="#f59e0b"/>

    <!-- Indicator Callout -->
    <g transform="translate(180, -140)">
      <line x1="0" y1="0" x2="70" y2="-40" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="70" cy="-40" r="4" fill="#f59e0b"/>
      <text x="80" y="-36" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">SISTEM MAGNET LEPAS-PASANG</text>
    </g>
  </g>

  <!-- Spec Tag -->
  <rect x="520" y="480" width="230" height="80" rx="8" fill="rgba(15, 31, 38, 0.85)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1.5"/>
  <text x="535" y="505" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">Model Portal 3D</text>
  <text x="535" y="525" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Skala: 1:50 Prosedural</text>
  <text x="535" y="545" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Komponen: 28 Bagian Terpisah</text>
</svg>
