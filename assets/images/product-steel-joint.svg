<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1921"/>
      <stop offset="100%" stop-color="#112530"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(20, 184, 166, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Blueprint Title Header -->
  <text x="50" y="60" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" letter-spacing="2">MINIKON 3D MODULAR</text>
  <text x="50" y="85" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">DWG-REF: SJ-WF200 • SKALA 1:10 • MODUL BONGKAR-PASANG</text>

  <!-- WF Beam & Column Connection -->
  <g transform="translate(400, 310)">
    <!-- Column Flanges and Web (Vertical WF) -->
    <rect x="-45" y="-220" width="90" height="440" fill="#1e293b" stroke="#38bdf8" stroke-width="3" rx="4"/>
    <rect x="-10" y="-220" width="20" height="440" fill="#0f172a" stroke="#2dd4bf" stroke-width="2"/>

    <!-- Horizontal WF Beam Left -->
    <rect x="-320" y="-60" width="275" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="3" rx="4"/>
    <line x1="-320" y1="0" x2="-45" y2="0" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Horizontal WF Beam Right -->
    <rect x="45" y="-60" width="275" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="3" rx="4"/>
    <line x1="45" y1="0" x2="320" y2="0" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Gusset Connection Plates & Stiffeners -->
    <polygon points="-75,-75 75,-75 55,-130 -55,-130" fill="rgba(20, 184, 166, 0.3)" stroke="#14b8a6" stroke-width="2"/>
    <polygon points="-75,75 75,75 55,130 -55,130" fill="rgba(20, 184, 166, 0.3)" stroke="#14b8a6" stroke-width="2"/>

    <!-- High Strength Mini Hex Bolts (Array) -->
    <!-- Left Joint Bolts -->
    <circle cx="-60" cy="-40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-60" cy="0" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-60" cy="40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-90" cy="-40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-90" cy="0" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-90" cy="40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Right Joint Bolts -->
    <circle cx="60" cy="-40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="60" cy="0" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="60" cy="40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="90" cy="-40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="90" cy="0" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="90" cy="40" r="7" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Callout Tags -->
    <g transform="translate(140, -110)">
      <line x1="0" y1="0" x2="60" y2="-40" stroke="#f59e0b" stroke-width="2"/>
      <line x1="60" y1="-40" x2="160" y2="-40" stroke="#f59e0b" stroke-width="2"/>
      <text x="65" y="-46" fill="#f59e0b" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">BAUT M16 BONGKAR-PASANG</text>
    </g>

    <g transform="translate(-140, 90)">
      <line x1="0" y1="0" x2="-50" y2="40" stroke="#2dd4bf" stroke-width="2"/>
      <line x1="-50" y1="40" x2="-160" y2="40" stroke="#2dd4bf" stroke-width="2"/>
      <text x="-155" y="34" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">PELAT SAMBUNGAN (GUSSET)</text>
    </g>
  </g>

  <!-- Technical Spec watermark -->
  <rect x="520" y="480" width="230" height="80" rx="8" fill="rgba(15, 31, 38, 0.85)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1.5"/>
  <text x="535" y="505" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13">MiniKon Modular Spec</text>
  <text x="535" y="525" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Bahan: Tough PLA-Carbon</text>
  <text x="535" y="545" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Sistem: Interlocking Pin & Screw</text>
</svg>
