<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="kitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1921"/>
      <stop offset="100%" stop-color="#102530"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="hexGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 40 10 L 40 30 L 20 40 L 0 30 L 0 10 Z" fill="none" stroke="rgba(20, 184, 166, 0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#kitBg)"/>
  <rect width="100%" height="100%" fill="url(#hexGrid)"/>

  <!-- Technical Header -->
  <text x="50" y="60" fill="#2dd4bf" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="20" letter-spacing="2">PAKET EDUKASI LENGKAP LAB SIPIL &amp; SMK</text>
  <text x="50" y="85" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">BUNDLE ALL-IN-ONE - 5 MODUL STRUKTUR + BUKU PANDUAN PRAKTIKUM</text>

  <!-- Modular Storage Case and Component Showcase -->
  <g transform="translate(400, 310)">
    <!-- Heavy Duty Case Base -->
    <rect x="-320" y="-150" width="640" height="320" rx="16" fill="url(#boxGrad)" stroke="#14b8a6" stroke-width="3"/>
    <rect x="-310" y="-140" width="620" height="300" rx="12" fill="#0b1319" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Foam Compartments -->
    <!-- Compartment 1: Beam-Column -->
    <rect x="-290" y="-120" width="180" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M-200 -80 L-200 -40 M-220 -60 L-180 -60" stroke="#2dd4bf" stroke-width="6" stroke-linecap="round"/>
    <text x="-200" y="-15" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Modul Balok-Kolom</text>

    <!-- Compartment 2: Foundation and Piles -->
    <rect x="-90" y="-120" width="180" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="-30" y="-85" width="60" height="30" fill="#14b8a6" rx="3"/>
    <circle cx="-15" cy="-70" r="5" fill="#f59e0b"/>
    <circle cx="15" cy="-70" r="5" fill="#f59e0b"/>
    <text x="0" y="-15" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Modul Pile Cap</text>

    <!-- Compartment 3: Steel Truss Section -->
    <rect x="110" y="-120" width="180" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="130,-50 170,-90 210,-50 250,-90 270,-50" fill="none" stroke="#2dd4bf" stroke-width="4"/>
    <text x="200" y="-15" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Truss Rangka Baja</text>

    <!-- Compartment 4: Rebar Cages and Accessories -->
    <rect x="-290" y="20" width="380" height="120" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Miniature rebar bars -->
    <line x1="-270" y1="50" x2="-100" y2="50" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-270" y1="70" x2="-100" y2="70" stroke="#f59e0b" stroke-width="3"/>
    <line x1="-270" y1="90" x2="-100" y2="90" stroke="#f59e0b" stroke-width="3"/>
    <!-- Stirrups -->
    <rect x="-80" y="45" width="35" height="55" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="-35" y="45" width="35" height="55" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="10" y="45" width="35" height="55" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <text x="-100" y="125" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Kit Tulangan &amp; Sengkang Lepas-Pasang (150 pcs)</text>

    <!-- Compartment 5: Handbook and Vernier Caliper -->
    <rect x="110" y="20" width="180" height="120" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="140" y="40" width="120" height="70" rx="4" fill="#0f766e"/>
    <text x="200" y="70" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" text-anchor="middle">BUKU PANDUAN</text>
    <text x="200" y="85" fill="#ccfbf1" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" text-anchor="middle">PRAKTIKUM SNI</text>
    <text x="200" y="125" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" text-anchor="middle">Modul Kurikulum</text>
  </g>
</svg>
