<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <!-- Dynamic 3D Structural / Modular Interlock Icon -->
  <g transform="translate(4, 8)">
    <rect x="0" y="8" width="22" height="32" rx="4" fill="url(#brandGrad1)" opacity="0.9" />
    <rect x="14" y="0" width="22" height="32" rx="4" fill="url(#brandGrad2)" />
    <rect x="28" y="8" width="22" height="32" rx="4" fill="url(#brandGrad1)" opacity="0.9" />
    <!-- Rebar / Modular Nodes -->
    <circle cx="11" cy="24" r="3" fill="#ffffff" />
    <circle cx="25" cy="16" r="3" fill="#0f1f26" />
    <circle cx="39" cy="24" r="3" fill="#ffffff" />
    <!-- Connecting truss line -->
    <path d="M11 24 L25 16 L39 24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography -->
  <text x="64" y="38" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Mini<tspan fill="#14b8a6">Kon</tspan><tspan fill="#38bdf8" font-size="20">.id</tspan>
  </text>
  <text x="66" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1.2">
    MINIATUR CETAK 3D SIPIL
  </text>

  <defs>
    <linearGradient id="brandGrad1" x1="0" y1="0" x2="30" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d9488" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="brandGrad2" x1="0" y1="0" x2="30" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
</svg>
